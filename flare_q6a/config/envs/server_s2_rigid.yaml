# 场景 2 刚性缆绳环境配置 - 刚性单连杆缆绳自由飞行
# 缆绳模型：刚性单连杆（2 自由度：俯仰 + 滚转）
# 奖励权重比基础配置更高，因为刚性缆绳任务更简单

env_cfg:
  num_actions: 4                # 动作空间维度（油门 + 滚转/俯仰/偏航角速率）
  max_throttle: 1.0             # 最大油门值 [0, 1]
  max_roll_rate: 15.0           # 最大滚转角速率（度/秒）
  max_pitch_rate: 15.0          # 最大俯仰角速率（度/秒）
  max_yaw_rate: 5.0             # 最大偏航角速率（度/秒）
  urdf_file: assets/suspended_system/real_sus_exp_rigid.urdf  # 刚性缆绳 URDF 模型

  # 终止条件
  termination_if_roll_greater_than: 180  # 滚转角超过此值时终止（度）
  termination_if_pitch_greater_than: 180 # 俯仰角超过此值时终止（度）
  termination_if_close_to_ground: 0.1    # 距地面小于此值时终止（米）
  termination_if_x_greater_than: 3.0     # X 偏移超过此值时终止（米）
  termination_if_y_greater_than: 3.0     # Y 偏移超过此值时终止（米）
  termination_if_z_greater_than: 2.0     # Z 偏移超过此值时终止（米）
  termination_cable_angle_threshold: 1.571 # 缆绳角度超过此值时终止（弧度，约 90°）

  # 初始状态
  base_init_pos: [0.0, 0.0, 1.0]         # 无人机初始位置 [x, y, z]（米）
  base_init_quat: [1.0, 0.0, 0.0, 0.0]   # 无人机初始姿态四元数 [w, x, y, z]
  episode_length_s: 15.0                  # 单个 episode 最大时长（秒）
  at_target_threshold: 0.5                # 到达目标判定距离（米）
  resampling_time_s: 3.0                  # 命令重采样时间（秒）
  simulate_action_latency: True           # 是否模拟动作延迟
  clip_actions: 1.0                       # 动作裁剪范围 [-1, 1]
  cable_length: 0.48                      # 缆绳长度（米）
  num_of_dofs: 2                          # 缆绳自由度数量（2 = 刚性单连杆）
  max_safety_violations: 150              # 最大安全违规累计次数
  max_safe_cable_angle_deg: 30            # 缆绳安全最大角度（度）
  visualize_target: False                 # 是否显示目标点
  visualize_camera: False                 # 是否启用相机录制
  max_visualize_FPS: 60                   # 可视化最大帧率
  TWR_max: 3.5                            # 最大推重比

# 观测空间配置
obs_cfg:
  num_obs: 26                             # 观测维度总数（与柔性缆绳相同）
  obs_scales:                             # 各观测分量的归一化缩放因子
    rel_pos_xy: 0.3333333333333333        # 相对位置 XY
    rel_pos_z: 1.0                        # 相对位置 Z
    lin_vel_xy: 0.1                       # 线速度 XY
    lin_vel_z: 0.3                        # 线速度 Z
    ang_vel_yaw: 0.3183098861837907       # 偏航角速度
    cable_angle: 0.66666667               # 缆绳角度
    cable_angle_vel: 0.1                  # 缆绳角速度

# 奖励函数配置（比基础配置权重更高）
reward_cfg:
  yaw_lambda: -10.0                       # 偏航奖励指数衰减系数
  reward_scales:                          # 各奖励项权重（刚性缆绳任务更简单，权重更大）
    target: 30.0                          # 目标到达奖励（基础配置为 10.0）
    smooth: -0.0001                       # 动作平滑惩罚
    yaw: 0.02                             # 偏航控制奖励（基础配置为 0.01）
    angular: -0.0003                      # 角速度惩罚（基础配置为 -0.0002）
    crash: -15.0                          # 碰撞惩罚（基础配置为 -10.0）
    cable_angle_safety: 0.5               # 缆绳安全奖励（连续奖励，基础配置为 0.03）
  unsafe_angle_penalty: 2.0               # 超过安全角度的额外惩罚（基础配置为 1.0）

# 命令配置（目标航点生成范围）
command_cfg:
  num_commands: 3                         # 命令维度 [x, y, z]
  pos_x_range: [-1.5, 1.5]               # 目标航点 X 范围（米）
  pos_y_range: [-1.5, 1.5]               # 目标航点 Y 范围（米）
  pos_z_range: [0.5, 1.5]                # 目标航点 Z 范围（米）
